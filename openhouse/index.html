<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top orange border ── */
  .top-bar {
    height: 5px;
    background: #E8470A;
    width: 100%;
  }

  /* ── Nav ── */
  .nav {
    background: #111;
    border-bottom: 1px solid #222;
    padding: 13px 40px;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #fff;
  }
  .nav span {
    color: #555;
    margin: 0 10px;
  }

  /* ── Hero ── */
  .hero {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 48px 40px;
    gap: 0;
  }

  .hero-left {
    flex: 1;
    padding-right: 40px;
    border-right: 1px solid #333;
  }

  .hero-left h1 {
    font-size: 2.8rem;
    font-weight: 800;
    color: #E8470A;
    line-height: 1.1;
    margin-bottom: 12px;
  }

  .hero-left p {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.65);
    line-height: 1.5;
  }

  .hero-right {
    flex: 1;
    padding-left: 40px;
  }

  .hero-right h2 {
    font-size: 2.4rem;
    font-weight: 800;
    color: #fff;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .hero-right p {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.5);
  }


  /* ── Mobile ── */
  @media (max-width: 600px) {
    .hero {
      flex-direction: column;
      padding: 32px 24px;
      gap: 28px;
    }
    .hero-left {
      border-right: none;
      border-bottom: 1px solid #333;
      padding-right: 0;
      padding-bottom: 28px;
    }
    .hero-right {
      padding-left: 0;
    }
    .hero-left h1 { font-size: 2rem; }
    .hero-right h2 { font-size: 1.75rem; }
    .nav { padding: 13px 16px; font-size: 0.75rem; }
  }
</style>
</head>
<body>

  <div class="top-bar"></div>

  <div class="nav">
    Buy <span>|</span> Sell <span>|</span> Lease <span>|</span> Property Management
  </div>

  <div class="hero">
    <div class="hero-left">
      <h1>Rosh Issac</h1>
      <p>Realtor®, Dreamhouse Realty &nbsp;·&nbsp; +1 (825) 449-5083</p>
    </div>
    <div class="hero-right">
      <h2>Open House Sign In Form</h2>
      <p>Presented by Rosh Issac &nbsp;·&nbsp; Issac Real Estate Team</p>
    </div>
  </div>

  <script>
    setTimeout(function() {
      window.location.replace("https://docs.google.com/forms/d/1zzU5c2rif78mLRgt4TtX4MSTPQ_gwgiG2CIWlNaKc2s/viewform");
    }, 2000);
  </script>

</body>
</html>
